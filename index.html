<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fleet Status</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d1a1d; --panel:#13242a; --panel2:#182e35; --line:#29424a; --text:#e9f0f1; --muted:#8fa6ab; --faint:#5f777d;
  --accent:#f2b632; --accent-ink:#1b1400;
  --run:#3fbf7f; --run-bg:rgba(63,191,127,.14);
  --idle:#e8b23a; --idle-bg:rgba(232,178,58,.14);
  --down:#e5675f; --down-bg:rgba(229,103,95,.14);
  --sold:#8a9aa0; --sold-bg:rgba(138,154,160,.16);
  --info:#5aa9e6; --info-bg:rgba(90,169,230,.14);
  --focus:#f2b632;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#f4f6f6; --panel:#ffffff; --panel2:#eef2f3; --line:#d5dfe1; --text:#13252a; --muted:#56707a; --faint:#8aa0a6; --accent:#e0a21c; --accent-ink:#1b1400; --run:#1e9a5c; --run-bg:rgba(30,154,92,.12); --idle:#b07c0a; --idle-bg:rgba(224,162,28,.16); --down:#c8423a; --down-bg:rgba(200,66,58,.1); --sold:#6b7c82; --sold-bg:rgba(107,124,130,.13); --info:#2878c0; --info-bg:rgba(40,120,192,.1); --shadow:0 10px 30px rgba(20,40,50,.15); color-scheme:light}}
:root[data-theme="light"]{--bg:#f4f6f6; --panel:#ffffff; --panel2:#eef2f3; --line:#d5dfe1; --text:#13252a; --muted:#56707a; --faint:#8aa0a6; --accent:#e0a21c; --accent-ink:#1b1400; --run:#1e9a5c; --run-bg:rgba(30,154,92,.12); --idle:#b07c0a; --idle-bg:rgba(224,162,28,.16); --down:#c8423a; --down-bg:rgba(200,66,58,.1); --sold:#6b7c82; --sold-bg:rgba(107,124,130,.13); --info:#2878c0; --info-bg:rgba(40,120,192,.1); --shadow:0 10px 30px rgba(20,40,50,.15); color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"IBM Plex Sans Thai","Noto Sans Thai","Leelawadee UI",Tahoma,sans-serif;font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}
header.top{border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.toprow{display:flex;align-items:center;gap:14px;padding:18px 0 10px;flex-wrap:wrap}
.badge-logo{background:var(--accent);color:var(--accent-ink);font-weight:700;font-family:ui-monospace,Consolas,monospace;padding:6px 9px;border-radius:7px;font-size:13px;letter-spacing:.5px}
.title h1{margin:0;font-size:20px;font-weight:700}
.title .sub{color:var(--muted);font-size:13px}
.spacer{flex:1}
.ctl{display:flex;flex-direction:column;gap:2px}
.ctl label{font-size:12px;color:var(--muted)}
select,input[type=text],input[type=search],input[type=date],input[type=number],input[type=email],input[type=password],textarea{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;outline:none}
select:focus,input:focus,textarea:focus{border-color:var(--focus)}
.iconbtn{background:transparent;border:1px solid var(--line);border-radius:8px;padding:7px 10px;cursor:pointer;color:var(--muted)}
.iconbtn:hover{color:var(--text);border-color:var(--muted)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 16px;cursor:pointer;color:var(--muted);font-weight:600;white-space:nowrap;display:flex;gap:8px;align-items:center;border-radius:8px 8px 0 0}
nav.tabs button:hover{color:var(--text)}
nav.tabs button.on{color:var(--text);background:var(--panel);border-bottom-color:var(--accent)}
nav.tabs svg{width:16px;height:16px}
main.wrap{padding-top:22px;padding-bottom:60px}
.search{display:flex;align-items:center;gap:12px;border:1.5px solid var(--muted);border-radius:12px;padding:14px 18px;background:var(--panel)}
.search:focus-within{border-color:var(--accent)}
.search input{flex:1;border:0;background:transparent;font-size:18px;padding:0}
.search svg{width:20px;height:20px;color:var(--muted)}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 8px;align-items:center}
.filters select{min-width:160px;padding:11px 12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{background:none;border:0;padding:10px 14px;cursor:pointer;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--text);color:var(--bg);font-weight:600}
.chk{display:flex;align-items:center;gap:8px;color:var(--muted);cursor:pointer;user-select:none}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;text-align:left;cursor:pointer;transition:border-color .15s}
.card:hover{border-color:var(--muted)}
.card.on{border-color:var(--accent)}
.card h3{margin:0 0 4px;font-size:16px}
.card p{margin:0;color:var(--muted);font-size:13px}
.card .num{font-size:24px;font-weight:700;margin-bottom:2px}
.note{border-left:3px solid var(--accent);background:var(--panel);padding:10px 16px;border-radius:0 8px 8px 0;margin:12px 0;font-size:14px}
.note.info{border-left-color:var(--info)}
h2.sec{font-size:17px;margin:26px 0 10px;display:flex;align-items:center;gap:10px}
h2.sec .spacer{flex:1}
.muted{color:var(--muted)}.small{font-size:13px}.faint{color:var(--faint)}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12.5px;font-weight:600;white-space:nowrap}
.p-run{background:var(--run-bg);color:var(--run)}.p-idle{background:var(--idle-bg);color:var(--idle)}
.p-down{background:var(--down-bg);color:var(--down)}.p-sold{background:var(--sold-bg);color:var(--sold)}
.p-info{background:var(--info-bg);color:var(--info)}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:600;color:var(--muted);background:var(--panel2);position:sticky;top:0;font-size:13px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover,tbody tr.sel{background:var(--panel2)}
tfoot td{font-weight:700;background:var(--panel2)}
tr.sub td{color:var(--muted);font-weight:500;background:transparent}
.star{background:none;border:0;cursor:pointer;color:var(--faint);font-size:17px;padding:0 4px;line-height:1}
.star.on{color:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi .l{font-size:12.5px;color:var(--muted)}
.kpi .v{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25}
.kpi .d{font-size:12px;color:var(--muted)}
.kpi.run{border-top:3px solid var(--run)}.kpi.idle{border-top:3px solid var(--idle)}.kpi.down{border-top:3px solid var(--down)}.kpi.sold{border-top:3px solid var(--sold)}.kpi.acc{border-top:3px solid var(--accent)}.kpi.info{border-top:3px solid var(--info)}
.up{color:var(--run)}.dn{color:var(--down)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.chart{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--panel2);min-width:120px}
.bar span{display:block;height:100%}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;display:inline-flex;gap:8px;align-items:center}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--down)}
.btn.sm{padding:4px 10px;font-size:13px;font-weight:500}
.btn svg{width:16px;height:16px}
.drop{border:2px dashed var(--line);border-radius:12px;padding:34px;text-align:center;background:var(--panel);cursor:pointer;transition:.15s}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--panel2)}
.drop h3{margin:0 0 6px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.foot{border-top:1px solid var(--line);margin-top:34px;padding-top:16px;font-size:14px;color:var(--muted)}
kbd{border:1px solid var(--line);border-radius:4px;padding:0 6px;font-family:ui-monospace,Consolas,monospace;font-size:12px;background:var(--panel)}
.drawer-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:none}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--bg);border-left:1px solid var(--line);z-index:41;transform:translateX(100%);transition:transform .2s;overflow-y:auto;box-shadow:var(--shadow)}
.drawer.open{transform:none}.drawer-bg.open{display:block}
.drawer .hd{position:sticky;top:0;background:var(--bg);padding:18px 20px 12px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.drawer .bd{padding:6px 20px 30px}
.drawer h3{margin:18px 0 8px;font-size:14px;color:var(--muted);font-weight:600}
dl.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;margin:0;font-size:14px}
dl.kv dt{color:var(--muted)}dl.kv dd{margin:0;word-break:break-word}
.months{display:grid;grid-template-columns:repeat(12,1fr);gap:3px}
.months div{text-align:center;font-size:11px;padding:6px 0;border-radius:4px;background:var(--panel2);color:var(--faint)}
.months div.r{background:var(--run-bg);color:var(--run);font-weight:600}
.months div.x{background:var(--idle-bg);color:var(--idle)}
.months div.s{background:var(--sold-bg);color:var(--sold)}
.months div.cur{outline:2px solid var(--accent)}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty h2{color:var(--text)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:8px;z-index:60;font-weight:600;display:none;max-width:90vw}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:none;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--bg);border:1px solid var(--line);border-radius:12px;max-width:640px;width:100%;max-height:90vh;overflow:auto;padding:20px 22px;box-shadow:var(--shadow)}
.modal h2{margin:0 0 10px;font-size:18px}
.diffbox{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
svg text{fill:var(--muted);font-size:11px;font-family:inherit}
.hidden{display:none!important}
@media (max-width:900px){.cards{grid-template-columns:1fr 1fr}.kpis{grid-template-columns:repeat(3,1fr)}.grid2{grid-template-columns:1fr}.diffbox{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.wrap{padding:0 16px}.kpis{grid-template-columns:1fr 1fr}.filters select{min-width:0;flex:1 1 45%}.title h1{font-size:17px}dl.kv{grid-template-columns:120px 1fr}}
@media print{header.top,nav,.filters,.btn,.iconbtn{display:none!important}body{background:#fff;color:#000}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="toprow">
      <span class="badge-logo">FLEET</span>
      <div class="title">
        <h1>สถานะรถวิ่งงาน ภาษี และ Leasing</h1>
        <div class="sub" id="subline">ยังไม่มีข้อมูล · นำเข้าไฟล์ Excel ที่แท็บ นำเข้า/ส่งออก</div>
      </div>
      <div class="spacer"></div>
      <div class="ctl"><label for="selCompany">บริษัท</label><select id="selCompany"></select></div>
      <div class="ctl"><label for="selPeriod">งวดรายงาน</label><select id="selPeriod"></select></div>
      <div id="role" class="ctl" style="justify-content:flex-end;padding-bottom:6px"></div>
    </div>
    <nav class="tabs" id="tabs">
      <button data-tab="search" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>ค้นหา</button>
      <button data-tab="run"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17h2l1-5h11l2 5h2M6 17a2 2 0 1 0 4 0M14 17a2 2 0 1 0 4 0M7 12l2-5h6l2 5"/></svg>สถานะวิ่งงาน</button>
      <button data-tab="tax"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>สถานะภาษี</button>
      <button data-tab="lease"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h4"/></svg>Leasing</button>
      <button data-tab="io"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 17v3h16v-3"/></svg>นำเข้า/ส่งออก</button>
    </nav>
  </div>
</header>

<main class="wrap" id="main"></main>

<div class="drawer-bg" id="drawerBg"></div>
<aside class="drawer" id="drawer" aria-label="รายละเอียดรถ"></aside>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileInput" accept=".xlsx,.xls,.xlsm,.csv" class="hidden">
<input type="file" id="jsonInput" accept=".json" class="hidden">

</body>
